<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma Dental Studio – Modern, Gentle & Restorative Dentistry</title>
    <meta
      name="description"
      content="Award-winning dental care with personalized treatments, verified clinician profiles, transparent pricing, and instant online appointment scheduling."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />

    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Luma Dental Studio – Modern, Gentle & Restorative Dentistry" />
    <meta
      property="og:description"
      content="Award-winning dental care with personalized treatments, verified clinician profiles, transparent pricing, and instant online appointment scheduling."
    />
    <meta property="og:site_name" content="Luma Dental Studio" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luma Dental Studio – Modern, Gentle & Restorative Dentistry" />
    <meta
      name="twitter:description"
      content="Award-winning dental care with personalized treatments, verified clinician profiles, transparent pricing, and instant online appointment scheduling."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1200&q=80" />

    <!-- Typography: Manrope & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org JSON-LD Structured Data for Dental Clinic -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Luma Dental Studio",
        "image": "https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1200&q=80",
        "telephone": "+1 (555) 234-5678",
        "email": "care@lumadentalstudio.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "450 Sutter Health Suite 1200",
          "addressLocality": "San Francisco",
          "addressRegion": "CA",
          "postalCode": "94108",
          "addressCountry": "US"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 37.7897,
          "longitude": -122.4074
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "18:30"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday"],
            "opens": "09:00",
            "closes": "15:00"
          }
        ],
        "priceRange": "$$",
        "servesCuisine": "Dental Healthcare",
        "currenciesAccepted": "USD, GBP, EUR",
        "paymentAccepted": "Credit Card, Cash, Dental Insurance, CareCredit"
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
