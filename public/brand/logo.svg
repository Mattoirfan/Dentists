    <!-- Delicate Enamel Highlight -->
    <path d="M28 26C27 28 26 32 27 35C28 32 30 28 33 25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
    
