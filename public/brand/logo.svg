<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <!-- Brand Symbol / Emblem -->
  <g transform="translate(10, 8)">
    <circle cx="36" cy="36" r="34" fill="#0D9488" fill-opacity="0.1" />
    <circle cx="36" cy="36" r="28" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="2 4" stroke-opacity="0.4" />
    
    <!-- Stylized Enamel & Radiant Smile Form -->
    <path d="M26 22C23 26 21 32 23 38C25 45 30 52 36 52C42 52 47 45 49 38C51 32 49 26 46 22C43 18 39 18 36 21C33 18 29 18 26 22Z" 
